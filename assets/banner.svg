<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#060810" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#e0e7ff" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="orbGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60" result="blur" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3" />
      <circle cx="40" cy="0" r="1.5" fill="#38bdf8" fill-opacity="0.3" />
    </pattern>
  </defs>

  <style>
    @keyframes pulse {
      0% { opacity: 0.3; transform: scale(0.95); }
      50% { opacity: 0.65; transform: scale(1.05); }
      100% { opacity: 0.3; transform: scale(0.95); }
    }
    @keyframes floatBeam {
      0% { stroke-dashoffset: 600; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes ripple {
      0% { r: 10; opacity: 0.8; }
      100% { r: 85; opacity: 0; }
    }
    .glowing-orb-1 {
      animation: pulse 8s ease-in-out infinite;
      transform-origin: 200px 100px;
    }
    .glowing-orb-2 {
      animation: pulse 10s ease-in-out infinite reverse;
      transform-origin: 1000px 300px;
    }
    .stream-beam {
      stroke-dasharray: 80 120;
      animation: floatBeam 8s linear infinite;
    }
    .pulse-ring {
      animation: ripple 3s cubic-bezier(0.1, 0.8, 0.3, 1) infinite;
    }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />

  <!-- Dynamic Glowing Orbs in Background -->
  <circle class="glowing-orb-1" cx="200" cy="80" r="180" fill="#38bdf8" opacity="0.25" filter="url(#orbGlow)" />
  <circle class="glowing-orb-2" cx="1020" cy="320" r="220" fill="#a855f7" opacity="0.2" filter="url(#orbGlow)" />
  <circle cx="600" cy="210" r="260" fill="#6366f1" opacity="0.12" filter="url(#orbGlow)" />

  <!-- Subtle Perspective Grid -->
  <rect width="1200" height="420" fill="url(#grid)" />

  <!-- Dynamic Data Stream Wave Lines -->
  <path class="stream-beam" d="M -50,340 C 250,260 450,380 750,300 C 950,250 1100,320 1250,280" fill="none" stroke="url(#accentGrad)" stroke-width="3" opacity="0.75" />
  <path class="stream-beam" d="M -50,360 C 200,380 500,280 800,340 C 1000,370 1150,290 1250,320" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.4" style="animation-duration: 6s;" />

  <!-- Animated Pulse Nodes -->
  <g transform="translate(140, 310)">
    <circle class="pulse-ring" cx="0" cy="0" r="20" fill="none" stroke="#38bdf8" stroke-width="2" />
    <circle cx="0" cy="0" r="6" fill="#38bdf8" filter="url(#glow)" />
  </g>
  <g transform="translate(1060, 110)">
    <circle class="pulse-ring" cx="0" cy="0" r="20" fill="none" stroke="#c084fc" stroke-width="2" style="animation-delay: 1.5s;" />
    <circle cx="0" cy="0" r="6" fill="#c084fc" filter="url(#glow)" />
  </g>

  <!-- Foreground Content -->
  <!-- Top Pill / Category Badge -->
  <g transform="translate(430, 48)">
    <rect width="340" height="34" rx="17" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity="0.95" />
    <circle cx="20" cy="17" r="5" fill="#10b981" filter="url(#glow)" />
    <text x="35" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#38bdf8" letter-spacing="1.5">ULTRA-LOW LATENCY STREAMING</text>
  </g>

  <!-- Main Title -->
  <text x="600" y="140" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" fill="url(#textGrad)" letter-spacing="-0.5">
    Awesome Cloud Gaming &amp; Console Portals
  </text>

  <!-- Subtitle -->
  <text x="600" y="185" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="500" fill="#94a3b8" letter-spacing="0.2">
    Curated SaaS Services, Open-Source Clients, Self-Hosted Streamers &amp; WebRTC Wrappers
  </text>

  <!-- Feature Cards / Badges Row in Foreground -->
  <g transform="translate(130, 245)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="210" height="74" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
    <circle cx="26" cy="37" r="14" fill="#38bdf8" fill-opacity="0.15" />
    <text x="26" y="42" text-anchor="middle" font-size="16">🎮</text>
    <text x="50" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Cloud Clients</text>
    <text x="50" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">GeForce NOW &bull; xCloud</text>

    <!-- Card 2 -->
    <rect x="240" y="0" width="210" height="74" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
    <circle cx="266" cy="37" r="14" fill="#818cf8" fill-opacity="0.15" />
    <text x="266" y="42" text-anchor="middle" font-size="16">⚡</text>
    <text x="290" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Self-Hosted</text>
    <text x="290" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">Sunshine &bull; Moonlight</text>

    <!-- Card 3 -->
    <rect x="480" y="0" width="210" height="74" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
    <circle cx="506" cy="37" r="14" fill="#c084fc" fill-opacity="0.15" />
    <text x="506" y="42" text-anchor="middle" font-size="16">📺</text>
    <text x="530" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Remote Portals</text>
    <text x="530" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">Chiaki-ng &bull; Greenlight</text>

    <!-- Card 4 -->
    <rect x="720" y="0" width="220" height="74" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
    <circle cx="746" cy="37" r="14" fill="#34d399" fill-opacity="0.15" />
    <text x="746" y="42" text-anchor="middle" font-size="16">🌐</text>
    <text x="770" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">WebRTC &amp; WASM</text>
    <text x="770" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">CloudRetro &bull; EmulatorJS</text>
  </g>

  <!-- Bottom Spec Bar -->
  <text x="600" y="375" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#64748b" letter-spacing="1.5">
    4K 120FPS HDR &bull; LOW-LATENCY AV1 / HEVC &bull; STEAM DECK &bull; LINUX &bull; BROWSER &bull; DUALSENSE &amp; XBOX
  </text>
</svg>